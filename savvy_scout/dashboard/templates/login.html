<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Savvy Scout</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/bidsavvy-mark.png') }}">
  <script>
    (function () {
      var saved = localStorage.getItem('savvy-scout-theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* Kept in sync with base.html's glassmorphism variables by hand
         (2026-09-09) -- this page can't extend base.html (the theme-flash-
         prevention script above must run before ANY stylesheet, including
         one from a shared parent template), so its own copy of the tokens
         has to be updated alongside base.html's whenever the theme changes. */
      --bg: #08090C;
      --surface: rgba(255,255,255,0.06);
      --brand-red: #AF1F23;
      --danger: #EF4444;
      --primary: #3B6EA5;
      --primary-dark: #2E5680;
      --navy: #FFFFFF;
      --text: #FFFFFF;
      --text-muted: #94A3B8;
      --border: rgba(255,255,255,0.12);
      --input-bg: rgba(255,255,255,0.03);
      --input-bg-focus: rgba(255,255,255,0.05);
      --flash-error-text: #FF8A8C;
      --tint-blue-text: #BFDBFE;
      --glass-blur: blur(24px);
      --glass-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 90px -30px rgba(139,92,246,0.15), inset 0 1px 1px rgba(255,255,255,0.15);
      --orb-color-1: rgba(99,102,241,0.18);
      --orb-color-2: rgba(6,182,212,0.16);
      --orb-color-3: rgba(217,70,239,0.12);
      --orb-color-4: rgba(59,130,246,0.12);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-heading: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    :root[data-theme="light"] {
      --bg: #EEF1F5;
      --surface: rgba(255,255,255,0.6);
      --navy: #0B1F3A;
      --text: #1F2937;
      --text-muted: #64748B;
      --border: rgba(11,31,58,0.12);
      --input-bg: rgba(11,31,58,0.03);
      --input-bg-focus: rgba(11,31,58,0.05);
      --flash-error-text: #B91C1C;
      --tint-blue-text: #1D4ED8;
      --glass-shadow: 0 15px 35px rgba(15,23,42,0.08), 0 0 60px -25px rgba(139,92,246,0.08), inset 0 1px 1px rgba(255,255,255,0.8);
      --orb-color-1: rgba(99,102,241,0.08);
      --orb-color-2: rgba(6,182,212,0.07);
      --orb-color-3: rgba(217,70,239,0.05);
      --orb-color-4: rgba(59,130,246,0.05);
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    /* Same ambient orbs as base.html -- login is the first thing anyone
       sees, so it needs the same glass canvas, not the flat solid
       background this page had before. Sizes/alpha bumped 2026-09-09 (see
       base.html's comment) -- the original values were too diffuse to
       read as color once blurred. */
    body::before, body::after, .bg-orb-3, .bg-orb-4 {
      content: ""; position: fixed; z-index: -1; border-radius: 50%;
      filter: blur(110px); pointer-events: none;
    }
    body::before { width: 850px; height: 850px; top: -250px; left: -8%; background: var(--orb-color-1); }
    body::after  { width: 950px; height: 950px; bottom: -300px; right: -10%; background: var(--orb-color-2); }
    .bg-orb-3    { width: 800px; height: 800px; top: 20%; left: 28%; background: var(--orb-color-3); }
    .bg-orb-4    { width: 700px; height: 700px; top: -100px; right: 10%; background: var(--orb-color-4); }
    .login-card {
      background: var(--surface);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--glass-shadow);
      position: relative; z-index: 1;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand .mark-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px; background: var(--primary);
      color: #FFFFFF; font-family: var(--font-heading); font-weight: 700; font-size: 18px;
      margin-bottom: 10px;
    }
    .brand-text { font-family: var(--font-heading); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; color: var(--navy); }
    .brand-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; margin-top: 6px; }
    h1 { font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: var(--navy); text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-top: 16px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; color: var(--text); background: var(--input-bg);
      transition: all 0.2s;
    }
    input:focus { outline: none; border-color: var(--primary); background: var(--input-bg-focus); box-shadow: 0 0 0 3px rgba(59,110,165,0.18); }
    .error-msg {
      background: rgba(239,68,68,0.1); color: var(--flash-error-text); padding: 10px 14px;
      border-radius: 6px; border-left: 4px solid var(--danger);
      font-size: 13px; font-weight: 500; margin: 16px 0 0;
    }
    .btn-signin {
      width: 100%; padding: 12px; margin-top: 24px;
      font-size: 14px; font-weight: 700; border: none; border-radius: 8px;
      background: var(--primary); color: white; cursor: pointer;
      font-family: inherit; letter-spacing: 0.5px; text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-signin:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,110,165,0.35); }
    .quick-access { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
    .quick-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-btn {
      padding: 9px; border: 1px solid var(--border); border-radius: 7px;
      background: rgba(255,255,255,0.02); color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .quick-btn:hover { border-color: var(--primary); color: var(--tint-blue-text); background: rgba(59,110,165,0.08); }
    .accounts-info { margin-top: 20px; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 12px; color: var(--text-muted); }
    .accounts-info strong { color: var(--text); }
    .accounts-info .pwd { color: var(--text-muted); margin-top: 4px; font-size: 11px; }
  </style>
</head>
<body>
<div class="bg-orb-3" aria-hidden="true"></div>
<div class="bg-orb-4" aria-hidden="true"></div>
  <div class="login-card">
    <div class="brand">
      <div class="mark-badge">S</div>
      <div class="brand-text">Savvy Scout</div>
      <div class="brand-sub">Procurement Intelligence</div>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Access the triage and approval dashboard.</p>

    <form method="post">
      <label for="username">Email or Username</label>
      <input type="text" id="username" name="username" value="{{ request.form.username or '' }}" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <button type="submit" class="btn-signin">Sign in</button>
    </form>
  </div>
</body>
</html>
