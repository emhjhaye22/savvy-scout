{% extends "base.html" %}
{% block title %}Change Password — TenderSight™{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}

<div class="card" style="max-width: 420px;">
  <div class="card-body">
    {% if error %}
    <p style="color: var(--danger); font-size: 13px; margin-bottom: 12px;">{{ error }}</p>
    {% endif %}
    <form method="post" style="display: flex; flex-direction: column; gap: 14px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Current password</label>
        <input type="password" name="current_password" required style="width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-alt); color: var(--text);">
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">New password</label>
        <input type="password" name="new_password" required minlength="8" style="width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-alt); color: var(--text);">
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="8" style="width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-alt); color: var(--text);">
      </div>
      <button type="submit" class="btn btn-approve">Update password</button>
    </form>
  </div>
</div>

{% endblock %}
